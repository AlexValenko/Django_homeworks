<header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom"><a href="/home/"
                                                                                   class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">

    <span class="fs-4">Гео-товар</span> </a>
    <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url 'catalog:home' %}" class="nav-link active" aria-current="page">Главная</a></li>
        <li class="nav-item"><a href="{% url 'catalog:products' %}" class="nav-link">Товары</a></li>
        <li class="nav-item"><a href="{% url 'catalog:contacts' %}" class="nav-link">О нас</a></li>
        {% if user.is_authenticated %}
        <li class="nav-item">
            <form method="post" action="{% url 'users:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn nav-link">
                    Выйти
                </button>
            </form>
        </li>
        {% else %}
        <li class="nav-item"><a href="{% url 'users:login' %}" class="nav-link">Вход</a></li>
        <li class="nav-item"><a href="{% url 'users:register' %}" class="nav-link">Регистрация</a></li>
        {% endif %}

    </ul>
</header>
