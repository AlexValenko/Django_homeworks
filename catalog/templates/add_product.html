{% extends 'base.html' %}

{% block title %} новый товар {% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-1 pb-md-4 mx-auto text-center">
    <h1 class="display-5">Добавить товар</h1>
    <p class="lead">Форма для заполнения данных о новом товаре. Работает в режиме отладки</p>
</div>

<div class="container">
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h4 class="my-1">Данные о новом товаре</h4>
        </div>
        <div class="card-body">
            <form method="post" action="" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="prod_name">Наименование продукта</label>
                    <input type="text" name="prod_name" class="form-control" id="prod_name" placeholder="Теодолит Т30"
                           required>
                </div>

                <div class="mb-3">
                    <label for="category">Категория</label>
                    <select name="category" class="form-control" id="category" required>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.category_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="price">Цена</label>
                    <input type="number" step="0.01" name="price" class="form-control" id="price"
                           placeholder="Введите цену в рублях" required>
                </div>

                <div class="mb-3">
                    <label for="description">Описание продукта</label>
                    <textarea name="description" class="form-control" id="description" rows="4"
                              placeholder="Введите описание" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="image">Загрузите изображение</label>
                    <input type="file" class="form-control" name="prod_image" id="image" accept="image/*">
                </div>

                <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Отправить</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
