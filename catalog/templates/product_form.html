{% extends 'base.html' %}

{% block title %} добавить товар {% endblock %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-1 pb-md-4 mx-auto text-center">
    <h1 class="display-5">Добавить товар</h1>
    <p class="lead">Форма для добавления/изменения товара. Работает в режиме отладки</p>
</div>

<div class="container">
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h4 class="my-1">Данные о товаре</h4>
        </div>
        <div class="card-body">
            <form method="post" action="" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p}}

                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
