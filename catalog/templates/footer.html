<footer class="my-3">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item"><a href="{% url 'catalog:home' %}" class="nav-link px-2 text-body-secondary">Главная</a>
        </li>
        <li class="nav-item"><a href="{% url 'catalog:products' %}" class="nav-link px-2 text-body-secondary">Товары</a>
        </li>
        <li class="nav-item"><a href="{% url 'catalog:contacts' %}" class="nav-link px-2 text-body-secondary">О нас</a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-item">
            <form method="post" action="{% url 'users:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn nav-link px-2 text-body-secondary">
                    Выйти
                </button>
            </form>
        </li>
        {% else %}
        <li class="nav-item"><a href="{% url 'users:login' %}" class="nav-link px-2 text-body-secondary">Вход</a></li>
        <li class="nav-item"><a href="{% url 'users:register' %}" class="nav-link px-2 text-body-secondary">Регистрация</a></li>
        {% endif %}

    </ul>
    <p class="text-center text-body-secondary">Django homeworks project</p>
</footer>
